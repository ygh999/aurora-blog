name: Deploy Aurora Blog

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # Add bindings from GitHub Secrets
      - name: Configure Bindings
        env:
          D1_DB_ID: ${{ secrets.D1_DATABASE_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
          KV_ID: ${{ secrets.KV_NAMESPACE_ID }}
        run: |
          node -e "
            const cfg = JSON.parse(require('fs').readFileSync('wrangler.jsonc','utf-8'));
            cfg.d1_databases = [{ binding: 'DB', database_name: 'aurora-blog-db', database_id: process.env.D1_DB_ID }];
            cfg.r2_buckets = [{ binding: 'R2', bucket_name: process.env.R2_BUCKET }];
            cfg.kv_namespaces = [{ binding: 'CACHE', id: process.env.KV_ID }];
            require('fs').writeFileSync('wrangler.jsonc', JSON.stringify(cfg, null, 2));
          "
          echo "--- wrangler.jsonc ---"
          cat wrangler.jsonc

      # Initialize D1 database (idempotent)
      - name: Init D1 Database
        run: npx wrangler d1 execute aurora-blog-db --remote --file=src/migrations/001_init.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Deploy
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
