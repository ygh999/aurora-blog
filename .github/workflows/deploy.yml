name: Deploy Aurora Blog

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # Inject database_id from GitHub Secret into wrangler.jsonc
      - name: Configure D1 Database ID
        run: |
          sed -i 's/REPLACE_VIA_GITHUB_SECRET_OR_DASHBOARD/${{ secrets.D1_DATABASE_ID }}/g' wrangler.jsonc
          echo "--- wrangler.jsonc ---"
          cat wrangler.jsonc

      # Initialize D1 database (idempotent)
      - name: Init D1 Database
        run: npx wrangler d1 execute aurora-blog-db --remote --file=src/migrations/001_init.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Deploy Worker
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
