name: Deploy Aurora Blog

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # Build a deploy config from the JSONC template.
      # Do not JSON.parse wrangler.jsonc: JSONC comments are valid for Wrangler but invalid JSON.
      - name: Configure Bindings
        env:
          D1_DB_ID: ${{ secrets.D1_DATABASE_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
          KV_ID: ${{ secrets.KV_NAMESPACE_ID }}
        run: |
          test -n "${D1_DB_ID}"
          test -n "${R2_BUCKET}"
          test -n "${KV_ID}"
          cp wrangler.ci.jsonc wrangler.jsonc
          sed -i "s|__D1_DATABASE_ID__|${D1_DB_ID}|g" wrangler.jsonc
          sed -i "s|__R2_BUCKET_NAME__|${R2_BUCKET}|g" wrangler.jsonc
          sed -i "s|__KV_NAMESPACE_ID__|${KV_ID}|g" wrangler.jsonc
          if grep -q "__.*__" wrangler.jsonc; then
            echo "Unreplaced placeholder found in wrangler.jsonc"
            exit 1
          fi
          echo "Wrangler bindings configured from GitHub Secrets."

      # Initialize D1 database (idempotent)
      - name: Init D1 Database
        run: npx wrangler d1 execute aurora-blog-db --remote --file=src/migrations/001_init.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Deploy
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
